name: svc-data-analysis

# ─────────────────────────────────────────────────────────────────────────────
# data-analysis — 2 instancias (Bai et al. 2020)
# Stateless: no tiene BD propia.
# Lee datos históricos de mysql-data-management vía usuario read-only
# o vía HTTP API de data-management (ver env DATA_ACCESS_MODE).
# Puerto HTTP: 8085/8086
#
# Dependencias externas:
#   - mysql-data-management → mysql-data-management:3306 (solo lectura)
#   - Consul                → consul-1:8500
# ─────────────────────────────────────────────────────────────────────────────

networks:
  landslide-net:
    external: true
    name: landslide-net

services:

  data-analysis-1:
    image: ghcr.io/tifacusil/data-analysis:latest
    container_name: data-analysis-1
    hostname: data-analysis-1
    restart: unless-stopped
    networks: [landslide-net]
    ports:
      - "8085:8080"
    env_file: ../envs/data-analysis.env
    environment:
      INSTANCE_ID: data-analysis-01
      HTTP_PORT: "8080"
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 15s

  data-analysis-2:
    image: ghcr.io/tifacusil/data-analysis:latest
    container_name: data-analysis-2
    hostname: data-analysis-2
    restart: unless-stopped
    networks: [landslide-net]
    ports:
      - "8086:8080"
    env_file: ../envs/data-analysis.env
    environment:
      INSTANCE_ID: data-analysis-02
      HTTP_PORT: "8080"
    init: true
    depends_on:
      data-analysis-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 15s