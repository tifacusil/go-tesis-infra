name: svc-data-analysis

# ─────────────────────────────────────────────────────────────────────────────
# data-analysis — 2 instancias (Bai et al. 2020)
# Stateless: no tiene BD propia.
#
# Puertos por instancia:
#   HTTP  8085/8086 → :8080  (frontend vía Nginx)
#   gRPC  50055/50056 → :50051 (server-to-server, e.g. early-warning-service)
#
# Dependencias externas:
#   - Redis   → redis:6379      (caché de resultados)
#   - Consul  → consul-1:8500   (service discovery)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  landslide-net:
    external: true
    name: landslide-net

services:

  data-analysis-1:
    image: ghcr.io/tifacusil/data-analysis:latest
    container_name: data-analysis-1
    hostname: data-analysis-1
    restart: unless-stopped
    networks: [landslide-net]
    ports:
      - "8085:8080"   # HTTP — proxied by Nginx
      - "9085:50051"  # gRPC — local debug only; other services use data-analysis-1:50051
    env_file: ../envs/data-analysis.env
    environment:
      ANALYSIS__INSTANCE_ID: data-analysis-01
      ANALYSIS__HTTP_PORT: "8080"
      ANALYSIS__GRPC_PORT: "50051"
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 15s

  data-analysis-2:
    image: ghcr.io/tifacusil/data-analysis:latest
    container_name: data-analysis-2
    hostname: data-analysis-2
    restart: unless-stopped
    networks: [landslide-net]
    ports:
      - "8086:8080"   # HTTP — proxied by Nginx
      - "9086:50051"  # gRPC — local debug only; other services use data-analysis-2:50051
    env_file: ../envs/data-analysis.env
    environment:
      ANALYSIS__INSTANCE_ID: data-analysis-02
      ANALYSIS__HTTP_PORT: "8080"
      ANALYSIS__GRPC_PORT: "50051"
    init: true
    depends_on:
      data-analysis-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 15s
