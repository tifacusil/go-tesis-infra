name: svc-project-management

# ─────────────────────────────────────────────────────────────────────────────
# project-management — 1 instancia (Bai et al. 2020)
# Puerto HTTP: 8090
#
# Dependencias externas:
#   - mysql-project-management → mysql-project-management:3306
#   - Consul                   → consul-1:8500
# ─────────────────────────────────────────────────────────────────────────────

networks:
  landslide-net:
    external: true
    name: landslide-net

services:

  project-management-1:
    image: ghcr.io/tifacusil/project-management:latest
    container_name: project-management-1
    hostname: project-management-1
    restart: unless-stopped
    networks: [landslide-net]
    ports:
      - "8090:8080"
      - "9090:9090"   # gRPC — umbrales por proyecto (consumido por early-warning, futuro)
    env_file: ../envs/project-management.env
    environment:
      INSTANCE_ID: project-management-01
      HTTP_PORT: "8080"
      GRPC_ADDR: ":9090"
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s