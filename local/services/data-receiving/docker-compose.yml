name: svc-data-receiving

# ─────────────────────────────────────────────────────────────────────────────
# data-receiving — 3 instancias (Bai et al. 2020, Tabla 2)
# Puerto TCP: 5000/5001/5002  (recepción de frames DTU)
# Puerto HTTP: 8080/8081/8082 (health check + métricas)
#
# Imagen publicada por el CD del repo go-data-receiving:
#   ghcr.io/tifacusil/go-data-receiving:latest
#
# Config: el binario lee variables RECEIVER__ (ver ../envs/data-receiving.env).
# Lo compartido va en el env_file; lo que varía por instancia (instance id y el
# host que Consul usa para el health check) va en `environment`.
#
# Dependencias externas (deben estar en landslide-net antes de levantar):
#   - RabbitMQ  → rabbitmq-1:5672
#   - Redis     → redis:6379
#   - Consul    → consul-1:8500
#
# Nota: la imagen es distroless (sin shell), por eso no se define un healthcheck
# de Docker con wget; el health real lo hace Consul vía HTTP GET /health/.
#
# Uso:
#   docker compose up -d           # levanta las 3 instancias
# ─────────────────────────────────────────────────────────────────────────────

networks:
  landslide-net:
    external: true
    name: landslide-net

services:

  data-receiving-1:
    image: ghcr.io/tifacusil/go-data-receiving:latest
    container_name: data-receiving-1
    hostname: data-receiving-1
    restart: unless-stopped
    networks: [landslide-net]
    ports:
      - "5000:5000"   # TCP — recepción de frames DTU
      - "8080:8080"   # HTTP — /health y /metrics
    env_file: ../envs/data-receiving.env
    environment:
      RECEIVER__PORT: "5000"
      RECEIVER__CONSUL__HEALTHPORT: "8080"
      RECEIVER__CONSUL__INSTANCEID: data-receiving-01
      # Consul (en contenedor) alcanza /health por el hostname del servicio, no localhost.
      RECEIVER__CONSUL__HEALTHCHECKHOST: data-receiving-1
    init: true

  data-receiving-2:
    image: ghcr.io/tifacusil/go-data-receiving:latest
    container_name: data-receiving-2
    hostname: data-receiving-2
    restart: unless-stopped
    networks: [landslide-net]
    ports:
      - "5001:5000"
      - "8081:8080"
    env_file: ../envs/data-receiving.env
    environment:
      RECEIVER__PORT: "5000"
      RECEIVER__CONSUL__HEALTHPORT: "8080"
      RECEIVER__CONSUL__INSTANCEID: data-receiving-02
      RECEIVER__CONSUL__HEALTHCHECKHOST: data-receiving-2
    init: true
    depends_on: [data-receiving-1]

  data-receiving-3:
    image: ghcr.io/tifacusil/go-data-receiving:latest
    container_name: data-receiving-3
    hostname: data-receiving-3
    restart: unless-stopped
    networks: [landslide-net]
    ports:
      - "5002:5000"
      - "8082:8080"
    env_file: ../envs/data-receiving.env
    environment:
      RECEIVER__PORT: "5000"
      RECEIVER__CONSUL__HEALTHPORT: "8080"
      RECEIVER__CONSUL__INSTANCEID: data-receiving-03
      RECEIVER__CONSUL__HEALTHCHECKHOST: data-receiving-3
    init: true
    depends_on: [data-receiving-1]
