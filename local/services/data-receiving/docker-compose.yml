name: svc-data-receiving

# ─────────────────────────────────────────────────────────────────────────────
# data-receiving — 3 instancias (Bai et al. 2020, Tabla 2)
# Puerto TCP: 5000/5001/5002  (recepción de frames DTU)
# Puerto HTTP: 8080/8081/8082 (health check + métricas)
#
# Imagen publicada por el CD del repo go-data-receiving:
#   ghcr.io/tifacusil/go-data-receiving:latest
#
# Config: el binario lee variables de entorno con nombres Go-style (ver
# ../envs/data-receiving.env), igual que el resto de servicios Go del fleet.
# Lo compartido va en el env_file; lo que varía por instancia (instance id, host
# que Consul usa para el health check) va en `environment`.
#
# Dependencias externas (deben estar en landslide-net antes de levantar):
#   - RabbitMQ  → rabbitmq-1:5672
#   - Redis     → redis:6379
#   - Consul    → consul-1:8500
#
# La imagen es Alpine (trae wget de busybox), por eso se define un healthcheck de
# Docker; el health real adicional lo hace Consul vía HTTP GET /health.
#
# Uso:
#   docker compose up -d           # levanta las 3 instancias
# ─────────────────────────────────────────────────────────────────────────────

networks:
  landslide-net:
    external: true
    name: landslide-net

services:

  data-receiving-1:
    image: ghcr.io/tifacusil/go-data-receiving:latest
    container_name: data-receiving-1
    hostname: data-receiving-1
    restart: unless-stopped
    # Alias compartido data-receiving: las 3 instancias resuelven al mismo
    # nombre DNS de Docker, que devuelve los 3 A-records → nginx hace round-robin
    # por request sobre el health/metrics (ver nginx.conf, location /api/v1/receiving/).
    networks:
      landslide-net:
        aliases:
          - data-receiving
    ports:
      - "5000:5000"   # TCP — recepción de frames DTU
      - "8080:8080"   # HTTP — /health y /metrics
    env_file: ../envs/data-receiving.env
    environment:
      INSTANCE_ID: data-receiving-01
      TCP_PORT: "5000"
      HEALTH_PORT: "8080"
      # Consul (en contenedor) alcanza /health por el hostname del servicio, no localhost.
      ADVERTISE_HOST: data-receiving-1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s
    init: true

  data-receiving-2:
    image: ghcr.io/tifacusil/go-data-receiving:latest
    container_name: data-receiving-2
    hostname: data-receiving-2
    restart: unless-stopped
    networks:
      landslide-net:
        aliases:
          - data-receiving
    ports:
      - "5001:5000"
      - "8081:8080"
    env_file: ../envs/data-receiving.env
    environment:
      INSTANCE_ID: data-receiving-02
      TCP_PORT: "5000"
      HEALTH_PORT: "8080"
      ADVERTISE_HOST: data-receiving-2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s
    init: true
    depends_on: [data-receiving-1]

  data-receiving-3:
    image: ghcr.io/tifacusil/go-data-receiving:latest
    container_name: data-receiving-3
    hostname: data-receiving-3
    restart: unless-stopped
    networks:
      landslide-net:
        aliases:
          - data-receiving
    ports:
      - "5002:5000"
      - "8082:8080"
    env_file: ../envs/data-receiving.env
    environment:
      INSTANCE_ID: data-receiving-03
      TCP_PORT: "5000"
      HEALTH_PORT: "8080"
      ADVERTISE_HOST: data-receiving-3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s
    init: true
    depends_on: [data-receiving-1]
