# rabbitmq.conf — configuración base para local
# Los passwords de usuarios se setean vía definitions.json o en el primer arranque.

# Cargar topología pre-declarada (exchanges, colas, usuarios, permisos)
load_definitions = /etc/rabbitmq/definitions.json

# Erlang cookie compartida entre nodos (debe coincidir en ambos)
# Se setea via RABBITMQ_ERLANG_COOKIE en rabbitmq.env

# Heartbeat y timeouts
heartbeat = 60
consumer_timeout = 3600000

# Límites de memoria (ajustar según RAM disponible en local)
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.5

# Logging estructurado
log.console = true
log.console.level = info
log.console.formatter = json
