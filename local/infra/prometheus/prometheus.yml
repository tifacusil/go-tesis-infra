global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local
    system: landslide-b

scrape_configs:

  # ── Host del servidor ──────────────────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # ── MySQL (uno por servicio) ───────────────────────────────────────────────
  - job_name: mysql
    static_configs:
      - targets:
          - 'mysqld-exporter-data-management:9104'
          - 'mysqld-exporter-user-management:9104'
          - 'mysqld-exporter-project-management:9104'
          - 'mysqld-exporter-early-warning:9104'
        labels:
          component: mysql

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq-exporter:9419']

  # ── Redis ─────────────────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # ── Microservicios Go (/metrics via prometheus/client_golang) ──────────────
  # Cada microservicio se registra en Consul; en local usamos static_configs.
  # Ajustar puertos según docker-compose de servicios.
  - job_name: microservices
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'data-receiving-1:8080'
          - 'data-management-1:8081'
          - 'data-analysis-1:8082'
          - 'early-warning-1:8083'
          - 'user-management-1:8084'
          - 'project-management-1:8085'
        labels:
          component: microservice
