global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: server
    system: landslide-a

scrape_configs:

  # ── Host del servidor ──────────────────────────────────────────────────────
  # CPU y memoria del servidor completo (métricas principales Bloque 1)
  - job_name: node
    static_configs:
      - targets: ['localhost:9100']

  # ── MySQL (instancia única compartida — arquitectura Sistema A) ────────────
  - job_name: mysql
    static_configs:
      - targets: ['localhost:9104']
        labels:
          component: mysql

  # ── Redis ─────────────────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ['localhost:9121']

  # RabbitMQ: sin management plugin — no hay exporter disponible.
  # Consumo de proceso cubierto por node_exporter vía process_* metrics.

  # Microservicios Sistema A: no exponen /metrics.
  # Throughput y latencia se obtienen de los reportes de Artillery.
