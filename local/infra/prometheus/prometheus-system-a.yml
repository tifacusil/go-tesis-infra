global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: server
    system: landslide-a

scrape_configs:

  # ── Host del servidor ──────────────────────────────────────────────────────
  # CPU y memoria del servidor completo (métricas principales Bloque 1)
  - job_name: node
    static_configs:
      - targets: ['localhost:9100']

  # ── MySQL (instancia única compartida — arquitectura Sistema A) ────────────
  - job_name: mysql
    static_configs:
      - targets: ['localhost:9104']
        labels:
          component: mysql

  # ── Redis ─────────────────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ['localhost:9121']

  # RabbitMQ: sin management plugin — no hay exporter disponible.
  # Consumo de proceso cubierto por node_exporter vía process_* metrics.

  # ── Microservicios Sistema A (/metrics propio) ─────────────────────────────
  # Ahora exponen /metrics en su mismo puerto HTTP. Prometheus corre en el
  # host junto a los servicios, por eso targets = localhost:<puerto app>.
  # Métricas por servicio:
  #   process_cpu_seconds_total, process_resident_memory_bytes  (CPU / RAM)
  #   <prefijo>_messages_processed_total | pm_requests_total     (throughput)
  #   <prefijo>_persist_latency_seconds_bucket                   (latencia p50..p99)
  - job_name: microservices
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8082', 'localhost:8086']
        labels:
          service: data-management
          component: microservice
      - targets: ['localhost:8088', 'localhost:8092']
        labels:
          service: early-warning
          component: microservice
      - targets: ['localhost:8084']
        labels:
          service: project-management
          component: microservice
      - targets: ['localhost:5000']
        labels:
          service: data-analysis
          component: microservice
