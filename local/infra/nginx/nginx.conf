# nginx.conf — API Gateway estático para desarrollo local
# En producción (K8s) esto se reemplaza por el Ingress Controller.
# En local no usamos consul-template para simplificar;
# los upstreams se actualizan manualmente al agregar instancias.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"upstream":"$upstream_addr",'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time"'
    '}';

  access_log /var/log/nginx/access.log json_combined;

  sendfile on;
  keepalive_timeout 65;

  # ─────────────────────────────────────────────────────────────────
  # Upstreams — round-robin entre instancias de cada microservicio
  # Agregar/quitar instancias aquí al escalar en local
  # ─────────────────────────────────────────────────────────────────

  upstream data_receiving {
    # 3 instancias según Bai et al. (2020)
    # Descomenta cuando levantes cada instancia
    server data-receiving-1:8080;
    # server data-receiving-2:8080;
    # server data-receiving-3:8080;
  }

  upstream data_management {
    server data-management-1:8080;
    # server data-management-2:8080;
  }

  upstream data_analysis {
    server data-analysis-1:8080;
    # server data-analysis-2:8080;
  }

  upstream early_warning {
    server early-warning-1:8080;
    # server early-warning-2:8080;
  }

  upstream user_management {
    server user-management-1:8080;
  }

  upstream project_management {
    server project-management-1:8080;
  }

  # ─────────────────────────────────────────────────────────────────
  # Server principal — API Gateway en :80
  # ─────────────────────────────────────────────────────────────────

  server {
    listen 80;
    server_name localhost;

    # Health check de Nginx mismo
    location /nginx-health {
      access_log off;
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }

    # Data Receiving — recepción de datos de sensores
    location /api/v1/receiving/ {
      proxy_pass         http://data_receiving/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Data Management — CRUD de lecturas
    location /api/v1/data/ {
      proxy_pass         http://data_management/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Data Analysis — algoritmos y predicción
    location /api/v1/analysis/ {
      proxy_pass         http://data_analysis/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    # Early Warning — alertas
    location /api/v1/warnings/ {
      proxy_pass         http://early_warning/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # User Management — autenticación
    location /api/v1/users/ {
      proxy_pass         http://user_management/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Project Management — gestión de proyectos
    location /api/v1/projects/ {
      proxy_pass         http://project_management/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
  }
}
