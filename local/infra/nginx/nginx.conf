# nginx.conf — API Gateway estático para desarrollo local
# En producción (K8s) esto se reemplaza por el Ingress Controller.
# En local no usamos consul-template para simplificar;
# los upstreams se actualizan manualmente al agregar instancias.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"upstream":"$upstream_addr",'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time"'
    '}';

  access_log /var/log/nginx/access.log json_combined;

  sendfile on;
  keepalive_timeout 65;

  # ─────────────────────────────────────────────────────────────────
  # Resolución DNS diferida
  # 127.0.0.11 = DNS interno de Docker. Al usar el hostname del backend
  # en una VARIABLE dentro de proxy_pass, nginx NO resuelve al arrancar
  # (no crashea si el microservicio aún no existe); resuelve por request.
  # Mientras el backend no exista devuelve 502, no impide el arranque.
  # El round-robin entre instancias lo provee el DNS de Docker cuando
  # varias réplicas comparten el mismo nombre de servicio en la red.
  # ─────────────────────────────────────────────────────────────────
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ─────────────────────────────────────────────────────────────────
  # Server principal — API Gateway en :80
  # ─────────────────────────────────────────────────────────────────

  server {
    listen 80;
    server_name localhost;

    # Health check de Nginx mismo
    location /nginx-health {
      access_log off;
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }

    # Data Receiving — recepción de datos de sensores
    location /api/v1/receiving/ {
      set                $svc http://data-receiving-1:8080;
      rewrite            ^/api/v1/receiving/(.*)$ /$1 break;
      proxy_pass         $svc;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Data Management — CRUD de lecturas
    location /api/v1/data/ {
      set                $svc http://data-management-1:8080;
      rewrite            ^/api/v1/data/(.*)$ /$1 break;
      proxy_pass         $svc;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Data Analysis — algoritmos y predicción
    location /api/v1/analysis/ {
      set                $svc http://data-analysis-1:8080;
      rewrite            ^/api/v1/analysis/(.*)$ /$1 break;
      proxy_pass         $svc;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    # Early Warning — alertas
    location /api/v1/warnings/ {
      set                $svc http://early-warning-1:8080;
      rewrite            ^/api/v1/warnings/(.*)$ /$1 break;
      proxy_pass         $svc;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # User Management — autenticación
    location /api/v1/users/ {
      set                $svc http://user-management-1:8080;
      rewrite            ^/api/v1/users/(.*)$ /$1 break;
      proxy_pass         $svc;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # Project Management — gestión de proyectos
    location /api/v1/projects/ {
      set                $svc http://project-management-1:8080;
      rewrite            ^/api/v1/projects/(.*)$ /$1 break;
      proxy_pass         $svc;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
  }
}
