config:
  target: "{{ $processEnvironment.TARGET_HOST }}"
  phases:
    - name: "steady-baseline-50vu"
      duration: 120
      arrivalRate: 50
    - name: "spike-to-400vu"
      duration: 30
      arrivalRate: 50
      rampTo: 400
    - name: "spike-hold-400vu"
      duration: 30
      arrivalRate: 400
    - name: "recovery-to-50vu"
      duration: 30
      arrivalRate: 400
      rampTo: 50
    - name: "steady-recovery-50vu"
      duration: 120
      arrivalRate: 50
  http:
    timeout: 30

scenarios:
  - name: "Ingest sensor frame"
    flow:
      - post:
          url: "/api/v1/data"
          headers:
            Content-Type: "application/json"
          json:
            sensor_id: "GNSS-{{ $randomInt(1, 20) }}"
            timestamp: "{{ $isoTimestamp }}"
            latitude: -12.046374
            longitude: -77.042793
            altitude: 154.3
            displacement_x: "{{ $randomNumber(-5.0, 5.0) }}"
            displacement_y: "{{ $randomNumber(-5.0, 5.0) }}"
            displacement_z: "{{ $randomNumber(-2.0, 2.0) }}"
