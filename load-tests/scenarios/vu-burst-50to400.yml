config:
  # host:port de una instancia data-receiving (ingesta TCP, ver README-engine.md).
  # TARGET_HOST debe ser "host" o "host:port" — sin esquema http://.
  target: "{{ $processEnvironment.TARGET_HOST }}"
  engines:
    dtu-tcp: {}
  phases:
    - name: "steady-baseline-50vu"
      duration: 120
      arrivalRate: 50
    - name: "spike-to-400vu"
      duration: 30
      arrivalRate: 50
      rampTo: 400
    - name: "spike-hold-400vu"
      duration: 30
      arrivalRate: 400
    - name: "recovery-to-50vu"
      duration: 30
      arrivalRate: 400
      rampTo: 50
    - name: "steady-recovery-50vu"
      duration: 120
      arrivalRate: 50

scenarios:
  - name: "Ingest GNSS frame (TCP)"
    engine: dtu-tcp
    flow:
      - send:
          projectId: "thesis_load_test"
          fixQuality: "rtk_fixed"
