config:
  target: "{{ $processEnvironment.TARGET_HOST }}"
  phases:
    - name: "steady-state-50vu"
      duration: 180
      arrivalRate: 50
    - name: "measure-50vu"
      duration: 420
      arrivalRate: 50
  http:
    timeout: 30

scenarios:
  - name: "Ingest sensor frame"
    flow:
      - post:
          url: "/api/v1/data"
          headers:
            Content-Type: "application/json"
          json:
            sensor_id: "GNSS-{{ $randomInt(1, 20) }}"
            timestamp: "{{ $isoTimestamp }}"
            latitude: -12.046374
            longitude: -77.042793
            altitude: 154.3
            displacement_x: "{{ $randomNumber(-5.0, 5.0) }}"
            displacement_y: "{{ $randomNumber(-5.0, 5.0) }}"
            displacement_z: "{{ $randomNumber(-2.0, 2.0) }}"
