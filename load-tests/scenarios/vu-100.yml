config:
  # host:port de una instancia data-receiving (ingesta TCP, ver README-engine.md).
  # TARGET_HOST debe ser "host" o "host:port" — sin esquema http://.
  target: "{{ $processEnvironment.TARGET_HOST }}"
  engines:
    dtu-tcp: {}
  phases:
    - name: "steady-state-100vu"
      duration: 180
      arrivalRate: 100
    - name: "measure-100vu"
      duration: 420
      arrivalRate: 100

scenarios:
  - name: "Ingest GNSS frame (TCP)"
    engine: dtu-tcp
    flow:
      - send:
          sensorType: "gnss"  # identity (project_id, sensor_id) viene del contract example de dtu-emulator — ver README-engine.md
