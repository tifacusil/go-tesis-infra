config:
  target: "http://{{ $processEnvironment.TARGET_HOST }}"
  phases:
    - name: "ramp-up"
      duration: 180                                            # 3 min de warmup silencioso
      arrivalRate: 1
      rampTo: "{{ $processEnvironment.SUSTAINED_RATE }}"
    - name: "sustained-load-12h"
      duration: 43200                                           # 12 h a la tasa máxima descubierta en Fase 1
      arrivalRate: "{{ $processEnvironment.SUSTAINED_RATE }}"
  http:
    timeout: 30
  plugins:
    metrics-by-endpoint: {}

scenarios:
  - name: "Ingest sensor frame"
    flow:
      - post:
          url: "/api/v1/data"
          headers:
            Content-Type: "application/json"
          json:
            sensor_id: "GNSS-{{ $randomInt(1, 20) }}"
            timestamp: "{{ $isoTimestamp }}"
            latitude: -12.046374
            longitude: -77.042793
            altitude: 154.3
            displacement_x: "{{ $randomNumber(-5.0, 5.0) }}"
            displacement_y: "{{ $randomNumber(-5.0, 5.0) }}"
            displacement_z: "{{ $randomNumber(-2.0, 2.0) }}"
