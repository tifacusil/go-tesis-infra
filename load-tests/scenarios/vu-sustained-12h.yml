config:
  # host:port de una instancia data-receiving (ingesta TCP, ver README-engine.md).
  # TARGET_HOST debe ser "host" o "host:port" — sin esquema http://.
  target: "{{ $processEnvironment.TARGET_HOST }}"
  engines:
    dtu-tcp: {}
  phases:
    - name: "ramp-up"
      duration: 180                                            # 3 min de warmup silencioso
      arrivalRate: 1
      rampTo: "{{ $processEnvironment.SUSTAINED_RATE }}"
    - name: "sustained-load-12h"
      duration: 43200                                           # 12 h a la tasa máxima descubierta en Fase 1
      arrivalRate: "{{ $processEnvironment.SUSTAINED_RATE }}"

scenarios:
  - name: "Ingest GNSS frame (TCP)"
    engine: dtu-tcp
    flow:
      - send:
          projectId: "thesis_load_test"
          fixQuality: "rtk_fixed"
