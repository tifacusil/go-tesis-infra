config:
  target: "{{ $processEnvironment.TARGET_HOST }}"
  phases:
    - name: "steady-state-1vu"
      duration: 180    # 3 min de warmup silencioso
      arrivalRate: 1
    - name: "measure-1vu"
      duration: 420    # 7 min de medición real
      arrivalRate: 1
  http:
    timeout: 30

scenarios:
  - name: "Ingest sensor frame"
    flow:
      - post:
          url: "/api/v1/data"
          headers:
            Content-Type: "application/json"
          json:
            sensor_id: "GNSS-{{ $randomInt(1, 20) }}"
            timestamp: "{{ $isoTimestamp }}"
            latitude: -12.046374
            longitude: -77.042793
            altitude: 154.3
            displacement_x: "{{ $randomNumber(-5.0, 5.0) }}"
            displacement_y: "{{ $randomNumber(-5.0, 5.0) }}"
            displacement_z: "{{ $randomNumber(-2.0, 2.0) }}"
