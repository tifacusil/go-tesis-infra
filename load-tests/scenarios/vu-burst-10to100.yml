config:
  # host:port de una instancia data-receiving (ingesta TCP, ver README-engine.md).
  # TARGET_HOST debe ser "host" o "host:port" — sin esquema http://.
  target: "{{ $processEnvironment.TARGET_HOST }}"
  engines:
    dtu-tcp: {}
  phases:
    - name: "steady-baseline-10vu"
      duration: 120
      arrivalRate: 10
    - name: "spike-to-100vu"
      duration: 15
      arrivalRate: 10
      rampTo: 100
    - name: "spike-hold-100vu"
      duration: 30
      arrivalRate: 100
    - name: "recovery-to-10vu"
      duration: 15
      arrivalRate: 100
      rampTo: 10
    - name: "steady-recovery-10vu"
      duration: 120
      arrivalRate: 10

scenarios:
  - name: "Ingest GNSS frame (TCP)"
    engine: dtu-tcp
    flow:
      - send:
          sensorType: "gnss"  # identity (project_id, sensor_id) viene del contract example de dtu-emulator — ver README-engine.md
