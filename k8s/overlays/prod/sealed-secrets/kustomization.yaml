apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SealedSecret cifrados, generados por bootstrap/seal-secrets.sh con kubeseal.
# Cada uno se descifra en el cluster y produce un Secret con el mismo `name` que
# espera el secretRef de los manifests de base/.
#
# NOTA: estos archivos NO existen hasta correr el sellado (necesitan la clave
# pública del controller en TU cluster). Hasta entonces, `kustomize build` del
# overlay prod fallará aquí — es esperado. Para validar la base sin secrets,
# construir k8s/base en su lugar.
resources:
  - mysql-data-management.yaml
  - mysql-user-management.yaml
  - mysql-project-management.yaml
  - mysql-early-warning.yaml
  - redis.yaml
  - rabbitmq.yaml
  - data-receiving.yaml
  - data-management.yaml
  - data-analysis.yaml
  - early-warning.yaml
  - user-management.yaml
  - project-management.yaml
