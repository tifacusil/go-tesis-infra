apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
    tier: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        env: prod
        system: landslide-b

    scrape_configs:

      # ── node_exporter (DaemonSet — un pod por nodo) ──────────────────────
      - job_name: node
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [landslide]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9100

      # ── MySQL exporters ───────────────────────────────────────────────────
      - job_name: mysql
        static_configs:
          - targets:
              - mysqld-exporter-data-management:9104
              - mysqld-exporter-user-management:9104
              - mysqld-exporter-project-management:9104
              - mysqld-exporter-early-warning:9104
            labels:
              component: mysql

      # ── RabbitMQ ──────────────────────────────────────────────────────────
      - job_name: rabbitmq
        static_configs:
          - targets: ['rabbitmq-exporter:9419']

      # ── Redis ─────────────────────────────────────────────────────────────
      - job_name: redis
        static_configs:
          - targets: ['redis-exporter:9121']

      # ── Estado de orquestacion (replicas, reinicios, readiness) ───────────
      # Fuente de la autorreparacion: node-exporter mide el anfitrion y los
      # /metrics de cada servicio miden el proceso, pero ninguno ve que el
      # orquestador retire o reinicie un pod.
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics:8080']

      # ── Microservicios Go (/metrics) ──────────────────────────────────────
      # Solo puerto 8080 — descarta gRPC (50051, 9090) y TCP raw (5000).
      - job_name: microservices
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [landslide]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_tier]
            action: keep
            regex: service
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8080
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
