# ── mysqld-exporter x4 (uno por BD, database-per-service) ────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter-data-management
  labels:
    app: mysqld-exporter-data-management
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysqld-exporter-data-management
  template:
    metadata:
      labels:
        app: mysqld-exporter-data-management
        tier: observability
    spec:
      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.19.0
          args:
            - '--mysqld.address=mysql-data-management:3306'
            - '--mysqld.username=exporter'
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysqld-exporter
                  key: password
          ports:
            - containerPort: 9104
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mysqld-exporter-data-management
  labels:
    app: mysqld-exporter-data-management
    tier: observability
spec:
  selector:
    app: mysqld-exporter-data-management
  ports:
    - port: 9104
      targetPort: 9104
---
