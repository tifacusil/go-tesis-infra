apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-data-management
  labels:
    app: mysql-data-management
    tier: infra
spec:
  serviceName: mysql-data-management
  replicas: 1
  selector:
    matchLabels:
      app: mysql-data-management
  template:
    metadata:
      labels:
        app: mysql-data-management
        tier: infra
    spec:
      containers:
        - name: mysql
          image: mysql:9.7.0
          # Bajo consumo de RAM (VPS 3.7Gi): buffer pool reducido y
          # performance_schema off. Ajustar si se mide rendimiento.
          args:
            - "--innodb-buffer-pool-size=32M"
            - "--innodb-buffer-pool-instances=1"
            - "--performance-schema=OFF"
            - "--max-connections=25"
            - "--table-open-cache=64"
            - "--thread-cache-size=4"
            - "--key-buffer-size=8M"
            - "--sort-buffer-size=256K"
            - "--read-buffer-size=256K"
            - "--join-buffer-size=256K"
            - "--tmp-table-size=16M"
            - "--max-heap-table-size=16M"
            - "--thread-stack=196608"
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-data-management
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 320Mi
      volumes:
        - name: initdb
          configMap:
            name: mysql-data-management-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
