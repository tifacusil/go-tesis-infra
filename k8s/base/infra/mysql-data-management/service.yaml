apiVersion: v1
kind: Service
metadata:
  name: mysql-data-management
  labels:
    app: mysql-data-management
    tier: infra
spec:
  # Headless: identidad estable de pod (StatefulSet). DNS: mysql-data-management.
  clusterIP: None
  selector:
    app: mysql-data-management
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
