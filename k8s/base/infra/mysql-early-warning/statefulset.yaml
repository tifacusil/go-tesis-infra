apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-early-warning
  labels:
    app: mysql-early-warning
    tier: infra
spec:
  serviceName: mysql-early-warning
  replicas: 1
  selector:
    matchLabels:
      app: mysql-early-warning
  template:
    metadata:
      labels:
        app: mysql-early-warning
        tier: infra
    spec:
      containers:
        - name: mysql
          image: mysql:9.7.0
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-early-warning
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: initdb
          configMap:
            name: mysql-early-warning-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
