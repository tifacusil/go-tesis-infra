apiVersion: v1
kind: ConfigMap
metadata:
  name: data-analysis-config
  labels:
    app: data-analysis
data:
  # Bind normal (0.0.0.0): en K8s el discovery lo da el Service.
  ANALYSIS__HOST: "0.0.0.0"
  ANALYSIS__HTTP_PORT: "8080"
  ANALYSIS__GRPC_PORT: "50051"
  # ReadingService gRPC de data-management (reemplaza el acceso directo a su
  # MySQL, database-per-service). Resuelto por DNS del Service K8s.
  DATA_MANAGEMENT_GRPC_ADDR: "data-management:9090"
  ENV: "prod"
  LOG_LEVEL: "info"
