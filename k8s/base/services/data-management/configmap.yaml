apiVersion: v1
kind: ConfigMap
metadata:
  name: data-management-config
  labels:
    app: data-management
data:
  # RabbitMQ (host = Service K8s)
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "data_management"
  RABBITMQ_QUEUE: "data_management.persist"
  # MySQL (host = Service K8s headless)
  MYSQL_HOST: "mysql-data-management"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "data_management"
  MYSQL_USER: "svc_data_mgmt"
  # Consul deshabilitado: en K8s el discovery lo da el Service. El registro
  # queda inerte (apunta a un host inexistente; el código es best-effort).
  CONSUL_ENABLED: "false"
  CONSUL_HOST: "consul-disabled"
  CONSUL_PORT: "8500"
  HTTP_PORT: "8080"
  ENV: "prod"
  LOG_LEVEL: "info"
