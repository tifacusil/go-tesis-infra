apiVersion: v1
kind: ConfigMap
metadata:
  name: data-receiving-config
  labels:
    app: data-receiving
data:
  RECEIVER__OUTPUTMODE: "rabbitmq"
  RECEIVER__DLXPATH: "/tmp/dlx"
  # Redis: el CONNECTIONSTRING lleva el password inline → va en el Secret, no aquí.
  RECEIVER__REDIS__BUFFERTLTHOURS: "24"
  RECEIVER__REDIS__RETRYINTERVALSECONDS: "30"
  RECEIVER__REDIS__RETRYMINAGEMINUTES: "2"
  RECEIVER__RABBITMQ__HOST: "rabbitmq"
  RECEIVER__RABBITMQ__PORT: "5672"
  RECEIVER__RABBITMQ__VIRTUALHOST: "/"
  RECEIVER__RABBITMQ__USERNAME: "data_receiving"
  RECEIVER__RABBITMQ__EXCHANGE: "sensors.raw"
  RECEIVER__RABBITMQ__CONFIRMTIMEOUTSECONDS: "5"
  RECEIVER__PORT: "5000"
  RECEIVER__CONSUL__HEALTHPORT: "8080"
  RECEIVER__CONSUL__SERVICEVERSION: "1.0.0"
  RECEIVER__CONSUL__ENVIRONMENT: "prod"
  # Consul deshabilitado: el registro apunta a un host que no resuelve (discovery
  # vía Service K8s). El health check real lo hace el readinessProbe del pod.
  RECEIVER__CONSUL__ADDRESS: "http://consul-disabled:8500"
