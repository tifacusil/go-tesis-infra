apiVersion: v1
kind: ConfigMap
metadata:
  name: user-management-config
  labels:
    app: user-management
data:
  # La app lee DB_* (conecta como root; el MySQL solo crea root).
  DB_HOST: "mysql-user-management"
  DB_PORT: "3306"
  DB_NAME: "user_management"
  DB_USER: "root"
  DB_ROOT_USER: "root"
  JWT_EXPIRY_MINUTES: "60"
  JWT_REFRESH_EXPIRY_DAYS: "7"
  GRPC_ADDR: ":9090"
  HTTP_PORT: "8080"
  # Consul deshabilitado: discovery vía Service K8s.
  CONSUL_ENABLED: "false"
  CONSUL_HOST: "consul-disabled"
  CONSUL_PORT: "8500"
  ENV: "prod"
  LOG_LEVEL: "info"
