apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management
  labels:
    app: user-management
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-management
  template:
    metadata:
      labels:
        app: user-management
        tier: service
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: user-management
          image: ghcr.io/tifacusil/user-management:latest
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: user-management-config
            - secretRef:
                name: user-management
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Sin limits.cpu — ver comentario en data-receiving/deployment.yaml:
              # el cap de 100m medía el throttling del cgroup, no la arquitectura,
              # y rompía la paridad contra Sistema A (systemd sin limite).
              memory: 256Mi
