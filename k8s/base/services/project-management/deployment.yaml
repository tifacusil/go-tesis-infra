apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-management
  labels:
    app: project-management
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-management
  template:
    metadata:
      labels:
        app: project-management
        tier: service
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: project-management
          image: ghcr.io/tifacusil/project-management:latest
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: project-management-config
            - secretRef:
                name: project-management
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
