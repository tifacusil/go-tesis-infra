apiVersion: apps/v1
kind: Deployment
metadata:
  name: early-warning
  labels:
    app: early-warning
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: early-warning
  template:
    metadata:
      labels:
        app: early-warning
        tier: service
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: early-warning
          image: ghcr.io/tifacusil/early-warning:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: early-warning-config
            - secretRef:
                name: early-warning
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Estuvo en 1 (consumo serial) mientras la carga emitia un solo
            # sensor_id: el sharding es por sensor, asi que todo caia en el
            # mismo worker — medido, cero mejora — y ademas ensanchaba el race
            # sobre el baseline en Redis entre las 2 replicas, que llevo la
            # tasa de alerta de 3.61% a 5.12% al pasar de 2 a 16 hilos.
            #
            # Las dos razones ya no aplican. La carga viene de una flota de
            # DTU_SENSOR_COUNT sensores (100 por defecto), asi que el sharding
            # tiene algo que repartir, y la escritura del baseline es un
            # compare-and-set que no deja retroceder la lectura sin importar
            # cuantas replicas escriban a la vez.
            - name: CONSUMER_WORKERS
              value: "8"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Sin limits.cpu — ver comentario en data-receiving/deployment.yaml:
              # el cap de 100m medía el throttling del cgroup, no la arquitectura,
              # y rompía la paridad contra Sistema A (systemd sin limite).
              memory: 256Mi
