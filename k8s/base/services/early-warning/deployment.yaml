apiVersion: apps/v1
kind: Deployment
metadata:
  name: early-warning
  labels:
    app: early-warning
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: early-warning
  template:
    metadata:
      labels:
        app: early-warning
        tier: service
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: early-warning
          image: ghcr.io/tifacusil/early-warning:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: early-warning-config
            - secretRef:
                name: early-warning
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 1 = consumo serial, el comportamiento previo al worker pool.
            #
            # Se puso en 1 porque con un solo sensor_id en la carga el sharding
            # (que es por sensor) mandaba todo al mismo worker — medido, cero
            # mejora — y ademas ensanchaba el race sobre el baseline en Redis
            # entre las 2 replicas: la tasa de alerta subio de 3.61% a 5.12% al
            # pasar de 2 a 16 hilos.
            #
            # Esas dos razones ya no aplican: la carga viene de una flota de
            # DTU_SENSOR_COUNT sensores y el baseline se escribe con
            # compare-and-set. Pero sigue en 1 porque falta la razon para
            # subirlo: en la escalera del 2026-07-22 la cola
            # early_warning.evaluate se mantuvo en 0 las 5 horas, o sea que
            # early-warning nunca fue el limitante. Mientras el techo lo ponga
            # el generador de carga (ver docs/ladder-b-2026-07-22.md §2),
            # agregar workers cambia una variable sin poder medir su efecto.
            - name: CONSUMER_WORKERS
              value: "1"
            # Ventana de dedup del Idempotent Consumer (early_warning:idemp:*).
            # El default de 24h deja una key por mensaje durante un dia entero:
            # en la prueba de 12h del 2026-09-18 eso fueron ~100k keys/h, que
            # llenaron el maxmemory de Redis y terminaron en el OOM del pod.
            # Los redeliveries de RabbitMQ llegan en segundos o minutos, asi que
            # 1h los cubre. Sistema A no deduplica, asi que esto tambien
            # mantiene la huella de Redis comparable entre los dos sistemas.
            - name: IDEMPOTENCY_TTL
              value: "1h"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Sin limits.cpu — ver comentario en data-receiving/deployment.yaml:
              # el cap de 100m medía el throttling del cgroup, no la arquitectura,
              # y rompía la paridad contra Sistema A (systemd sin limite).
              memory: 256Mi
